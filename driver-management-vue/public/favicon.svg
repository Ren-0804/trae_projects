<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="32" fill="#3b6cc8"/>

  <!-- Truck/Van Icon -->
  <g transform="translate(12, 16)">
    <!-- Main Body -->
    <rect x="4" y="8" width="28" height="16" rx="2" fill="white"/>
    <!-- Cabin -->
    <rect x="24" y="12" width="12" height="12" rx="1" fill="white"/>
    <!-- Windows -->
    <rect x="27" y="15" width="6" height="6" rx="0.6" fill="#3b6cc8"/>
    <!-- Wheels -->
    <circle cx="10" cy="28" r="4" fill="#2c5aa0"/>
    <circle cx="34" cy="28" r="4" fill="#2c5aa0"/>
    <!-- Wheel Details -->
    <circle cx="10" cy="28" r="1.6" fill="white"/>
    <circle cx="34" cy="28" r="1.6" fill="white"/>
  </g>

  <!-- Management Badge -->
  <g transform="translate(36, 8)">
    <circle cx="10" cy="10" r="8" fill="#ef4444"/>
    <path d="M10 5 L13 8 L15 5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="12" r="1" fill="white"/>
  </g>
</svg>