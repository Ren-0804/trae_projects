version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: driver-management-db
    environment:
      POSTGRES_DB: driver_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - driver-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: driver-management-redis
    ports:
      - "6379:6379"
    networks:
      - driver-network

  # Backend API
  backend:
    build:
      context: ./driver-management-api
      dockerfile: Dockerfile
    container_name: driver-management-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@postgres:5432/driver_management
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-here-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://frontend:80
    volumes:
      - ./driver-management-api/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - driver-network

  # Frontend
  frontend:
    build:
      context: ./driver-management-vue
      dockerfile: Dockerfile
    container_name: driver-management-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - driver-network

volumes:
  postgres_data:

networks:
  driver-network:
    driver: bridge